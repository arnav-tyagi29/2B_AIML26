<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check for voting eligibility</title>
    <!-- <script>
      function sum() {
        let a = 10;
        let b = 20;

        document.write(c);
      }

    <script>
      function vote() {
        let age = parseInt(prompt("Enter the value of age : "));
        if (age >= 18) {
          alert("You are eligible for voting.");
        } else {
          alert("You are not eligible for voting.");
        }
      }
    </script>
  </head>
  <body>
    <!-- <input type="button" onclick="sum()" value="Result" /> -->
    <input type="button" onclick="vote()" value="Eligibility" />
  </body>
</html>
